name: Xray-WinOptimize (latest upstream)

on:
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '留空使用 Xray 最新 Release（包含预发布）；填写 vXX.X.X 可指定版本'
        required: false
        default: ''
        type: string

permissions:
  contents: write
concurrency:
  group: xray-winopt-release
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select upstream release and check duplicate publication
        id: upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $tag = $env:REQUESTED_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $response = Invoke-WebRequest -Method Get -Uri 'https://api.github.com/repos/XTLS/Xray-core/releases?per_page=100' -Headers $headers -ErrorAction Stop
            $jsonPath = Join-Path $env:RUNNER_TEMP 'xray-upstream-releases.json'
            Set-Content -LiteralPath $jsonPath -Value $response.Content -Encoding utf8 -NoNewline
            $tag = python scripts/select_latest_release.py $jsonPath
            if ($LASTEXITCODE -ne 0) { throw "Upstream release selector failed (exit $LASTEXITCODE)" }
            if ([string]::IsNullOrWhiteSpace($tag)) { throw 'No published Xray release found' }
          }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Unsupported upstream tag: $tag" }
          $release = "$tag-winopt"
          Write-Host "Selected upstream tag: $tag (latest includes prereleases)"
          Write-Host "Checking release: $release"
          $uri = "https://api.github.com/repos/$($env:GITHUB_REPOSITORY)/releases/tags/$release"
          $check = Invoke-WebRequest -Method Get -Uri $uri -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          switch ([int]$check.StatusCode) {
            200 { $exists = 'true'; Write-Host 'Release already exists; skipping duplicate build.' }
            404 { $exists = 'false'; Write-Host 'Release not published; starting build.' }
            default { throw "Cannot check release: HTTP $($check.StatusCode)" }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
      - name: Fetch exact upstream Xray release
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch '${{ steps.upstream.outputs.tag }}' https://github.com/XTLS/Xray-core.git xray-src
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          git -C xray-src rev-parse HEAD | Out-File upstream-commit.txt
      - uses: actions/setup-go@v5
        if: steps.upstream.outputs.exists != 'true'
        with:
          go-version-file: xray-src/go.mod
          cache: false
      - name: Test Windows optimization policy and patcher
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          go test ./portable ./recvwindow
          if ($LASTEXITCODE -ne 0) { throw 'Go unit tests failed' }
          go build ./portable
          if ($LASTEXITCODE -ne 0) { throw 'Windows optimizer module build failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
      - name: Apply Windows TCP optimization patch
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          python patch/apply_portable.py xray-src
          if ($LASTEXITCODE -ne 0) { throw 'Patch incompatible with upstream release; stop' }
          gofmt -w xray-src/transport/internet/system_dialer.go
          Get-ChildItem xray-src/transport/internet/winopt_*.go | ForEach-Object { gofmt -w $_.FullName }
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
      - name: Compile Xray-WinOptimize Windows amd64
        if: steps.upstream.outputs.exists != 'true'
        working-directory: xray-src
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -buildvcs=false -o ../xray-winopt.exe ./main
          if ($LASTEXITCODE -ne 0) { throw 'Xray compile failed' }
      - name: Prepare release ZIP
        if: steps.upstream.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item xray-winopt.exe release/
          Copy-Item upstream-commit.txt release/
          Copy-Item README.md release/README-project.zh-CN.md
          Copy-Item README.en.md release/README-project.en.md
          Copy-Item docs/TECHNICAL.md release/TECHNICAL.md
          Copy-Item docs/INSTALL-WINDOWS.md release/
          Copy-Item LICENSE release/
          Get-FileHash release/xray-winopt.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
          Compress-Archive release/* "xray-${{ steps.upstream.outputs.tag }}-winopt.zip" -Force
      - name: Upload Xray-WinOptimize artifact
        if: steps.upstream.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xray-winopt-${{ steps.upstream.outputs.tag }}
          path: xray-${{ steps.upstream.outputs.tag }}-winopt.zip
      - name: Publish beta only after owner enables opt-in
        if: steps.upstream.outputs.exists != 'true' && vars.ENABLE_WINOPT_PRERELEASE == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ steps.upstream.outputs.release }}' "xray-${{ steps.upstream.outputs.tag }}-winopt.zip" --prerelease --title '${{ steps.upstream.outputs.tag }} Xray-WinOptimize' --notes 'Experimental Windows TCP receive optimization; standard Windows sockets, no additional driver or administrator privilege. See docs/TECHNICAL.md and validation status.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
